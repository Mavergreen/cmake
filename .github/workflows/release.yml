name: release

on:
  push:
    branches-ignore: ['renovate/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      local_release:
        description: "Cut a -mavericks.(N+1) repackage of the current upstream"
        type: boolean
        default: false
      reconcile:
        description: "Set by the nightly reconcile backstop: publish only if no release carries this declared state"
        type: boolean
        default: false

permissions:
  contents: read

# spec: shipyard SKILL.md "Release workflow" -- a run that can publish is alone in its group
concurrency:
  group: >-
    release-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ver:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.full }}
      publish: ${{ steps.ver.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: Mavergreen/shipyard/.github/actions/install@v1
      - id: ver
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LOCAL_RELEASE: ${{ inputs.local_release }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mode="$(sh "$SHIPYARD_SCRIPTS/release-mode.sh")"
          out="$(sh build/version.sh "$mode")"
          full="$(printf '%s\n' "$out" | sed -n 's/^FULL=//p')"
          rel="$(printf '%s\n' "$out" | sed -n 's/^RELEASE=//p')"
          [ -n "$full" ] || { echo "::error::version.sh gave no FULL= line: $out"; exit 1; }
          # spec: SKILL.md "Release workflow" -- only a push to main or an explicit dispatch publishes
          case "$GITHUB_EVENT_NAME:$GITHUB_REF" in
            push:refs/heads/main) : ;;
            workflow_dispatch:*)
              # spec: SKILL.md "A release is a declared state, not an event" -- a dispatch that is not a
              #       repackage publishes only a declared state no release carries yet, as N+1
              if [ "$mode" = auto ] && [ "$rel" != yes ]; then
                digest="$(sh "$SHIPYARD_SCRIPTS/release-state.sh")"
                answer="$(sh "$SHIPYARD_SCRIPTS/release-needed.sh" --digest "$digest" --version "$full" --repo "$GITHUB_REPOSITORY")"
                echo "release-needed: $answer"
                if [ "$answer" = PUBLISH ]; then
                  out="$(sh build/version.sh local)"
                  full="$(printf '%s\n' "$out" | sed -n 's/^FULL=//p')"
                  rel=yes
                fi
              fi ;;
            *) rel=no ;;
          esac
          { echo "full=$full"; echo "release=$rel"; } >> "$GITHUB_OUTPUT"
          echo "version=$full publish=$rel"

  build:
    needs: ver
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: Mavergreen/shipyard/.github/actions/install@v1
      - name: Build out of tree
        run: echo "MAVERICKS_BUILD_ROOT=$RUNNER_TEMP/mm-build" >> "$GITHUB_ENV"
      - name: The pkg test reads its payload with cpio
        run: command -v cpio || { sudo apt-get update -qq && sudo apt-get install -y -qq cpio; }
      - name: Pin the version the ver job resolved
        run: printf '%s\n' "${{ needs.ver.outputs.version }}" > VERSION
      - name: Record the pre-build tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh" --record
      - id: slices
        if: needs.ver.outputs.publish != 'yes'
        uses: actions/cache/restore@v6
        with:
          key: cmake-slices-${{ hashFiles('UPSTREAM_VERSION', 'components/clang22/version', 'patches/**', 'build/*.sh') }}
          path: |
            ${{ runner.temp }}/mm-build/mavergreen-cmake/slice-x86_64
            ${{ runner.temp }}/mm-build/mavergreen-cmake/slice-arm64
            ${{ runner.temp }}/mm-build/mavergreen-cmake/slice-x86_64.build-tools.txt
            ${{ runner.temp }}/mm-build/mavergreen-cmake/slice-arm64.build-tools.txt
      - name: Build, gate and merge both slices
        env:
          SLICES_CACHED: ${{ steps.slices.outputs.cache-hit }}
        run: |
          set -eu
          if [ "$SLICES_CACHED" = true ]; then
            SLICE_X86_64="$MAVERICKS_BUILD_ROOT/mavergreen-cmake/slice-x86_64"
            SLICE_ARM64="$MAVERICKS_BUILD_ROOT/mavergreen-cmake/slice-arm64"
            export SLICE_X86_64 SLICE_ARM64
          fi
          tree="$(sh build/build.sh)"
          echo "TREE=$tree" >> "$GITHUB_ENV"
      - if: steps.slices.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          key: cmake-slices-${{ hashFiles('UPSTREAM_VERSION', 'components/clang22/version', 'patches/**', 'build/*.sh') }}
          path: |
            ${{ runner.temp }}/mm-build/mavergreen-cmake/slice-x86_64
            ${{ runner.temp }}/mm-build/mavergreen-cmake/slice-arm64
            ${{ runner.temp }}/mm-build/mavergreen-cmake/slice-x86_64.build-tools.txt
            ${{ runner.temp }}/mm-build/mavergreen-cmake/slice-arm64.build-tools.txt
      - name: Package
        run: sh build/package.sh "$TREE" "${{ needs.ver.outputs.version }}" dist
      - name: Every host-agnostic test runs, and none skips
        run: sh "$SHIPYARD_SCRIPTS/run-repo-tests.sh" --strict-host
      - name: Ingredient pins are well declared
        run: sh "$SHIPYARD_SCRIPTS/check-ingredient-pins.sh"
      - name: Release notes
        run: |
          set -eu
          V="${{ needs.ver.outputs.version }}"
          sh "$SHIPYARD_SCRIPTS/release-notes.sh" --tag "$V" --version "$V" \
            --product CMake --min-os 10.9.5 --out dist/RELEASE_NOTES.md
      - name: Record the declared state in the notes
        run: |
          set -eu
          digest="$(sh "$SHIPYARD_SCRIPTS/release-state.sh")"
          sh "$SHIPYARD_SCRIPTS/release-state-record.sh" --notes-file dist/RELEASE_NOTES.md --digest "$digest"
      - name: clang22's Mach-O readers, for the steps that read the pkg
        run: |
          set -eu
          CL="$(sh build/fetch-clang22.sh)"
          { echo "LIPO=$CL/bin/llvm-lipo"; echo "OTOOL=$CL/bin/llvm-otool"; echo "NM=$CL/bin/llvm-nm"; } >> "$GITHUB_ENV"
      - name: Sign the pkg and write its feed
        if: needs.ver.outputs.publish == 'yes'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          printenv SPARKLE_PRIVATE_KEY | grep -q . || { echo "::error::SPARKLE_PRIVATE_KEY is not visible to this repo"; exit 1; }
          V="${{ needs.ver.outputs.version }}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/$V"
          sh "$SHIPYARD_SCRIPTS/sign_and_appcast.sh" --product cmake --feed-dir dist \
            --channel-title "CMake for Mavericks" --version "$V" --pkg-url "$base/cmake-$V.pkg" \
            --notes-file dist/RELEASE_NOTES.md --pkg "dist/cmake-$V.pkg" --min-os 10.9.5
      - name: Unsigned stand-in feed (never published)
        if: needs.ver.outputs.publish != 'yes'
        run: sh "$SHIPYARD_SCRIPTS/stand-in-feeds.sh" dist "${{ needs.ver.outputs.version }}"
      - name: Artifact conformance
        run: |
          set -eu
          facts="$(sh "$SHIPYARD_SCRIPTS/artifact-facts.sh" dist "${{ needs.ver.outputs.version }}")"
          printf '%s\n' "$facts" | sh "$SHIPYARD_SCRIPTS/check-artifact-conformance.sh"
      - name: The feed is an upgrade
        if: needs.ver.outputs.publish == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh "$SHIPYARD_SCRIPTS/assert_appcast_upgradeable.sh" --appcast dist/cmake.xml --version "${{ needs.ver.outputs.version }}"
      - name: The binaries the pkg was made from, for repackaging elsewhere
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -eu
          tar -cf "$RUNNER_TEMP/cmake-binaries.tar" -C "$MAVERICKS_BUILD_ROOT/mavergreen-cmake" \
            tree build-tools.txt updater/cmake-updater.app updater/build-tools.txt
      - uses: actions/upload-artifact@v7
        with:
          name: mavergreen-cmake
          if-no-files-found: error
          path: |
            dist/*.pkg
            dist/build-info-*.txt
            dist/RELEASE_NOTES.md
            dist/*.xml
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: cmake-binaries
          if-no-files-found: error
          path: ${{ runner.temp }}/cmake-binaries.tar
      - name: The build must not have written into the source tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh"

  vm-test:
    needs: [ver, build]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v8
        with: { name: mavergreen-cmake, path: dist }
      - name: Install the pkg on Mac OS X 10.9, run the on-target test and launch the updater
        uses: Mavergreen/mavericks-vm@v1
        env:
          CMAKE_FULL_VERSION: ${{ needs.ver.outputs.version }}
        with:
          image-key: ${{ secrets.MAVERICKS_VM_KEY }}
          envs: CMAKE_FULL_VERSION
          copyback: false
          run: |
            set -eu
            sw_vers
            if [ -e /Library/Developer/CommandLineTools ]; then echo "this guest has the Command Line Tools"; else echo "this guest has no Command Line Tools"; fi
            sudo -n true || { echo "the guest's user cannot sudo without a password, and installer needs root"; exit 1; }
            sudo installer -pkg "dist/cmake-$CMAKE_FULL_VERSION.pkg" -target /
            /usr/local/bin/mavergreen check
            sh tests/on-target.sh "$CMAKE_FULL_VERSION"
            sh build/launch-updater.sh

  modern-smoke:
    needs: [ver, build]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || startsWith(github.head_ref, 'renovate/')
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v8
        with: { name: mavergreen-cmake, path: dist }
      - name: Install the pkg, run its arm64 cmake through the on-target test, and launch its updater
        env:
          CMAKE_FULL_VERSION: ${{ needs.ver.outputs.version }}
        run: |
          set -eu
          [ "$(uname -m)" = arm64 ] && [ "$(arch)" = arm64 ] || { echo "::error::this runner is not running arm64 natively"; exit 1; }
          sudo installer -pkg "dist/cmake-$CMAKE_FULL_VERSION.pkg" -target /
          /usr/local/bin/mavergreen check
          sh tests/on-target.sh "$CMAKE_FULL_VERSION"
          sh build/launch-updater.sh

  scan:
    needs: [ver, build]
    if: always() && needs.ver.outputs.publish == 'yes'
    permissions: { actions: read, contents: read }
    uses: Mavergreen/shipyard/.github/workflows/scan-for-key.yml@v1
    with: { artifact: mavergreen-cmake }
    secrets: { SPARKLE_PRIVATE_KEY: "${{ secrets.SPARKLE_PRIVATE_KEY }}" }

  publish:
    needs: [ver, build, vm-test, modern-smoke, scan]
    if: needs.ver.outputs.publish == 'yes'
    permissions: { contents: write }
    uses: Mavergreen/shipyard/.github/workflows/publish-release.yml@v1
    with: { version: "${{ needs.ver.outputs.version }}", artifact: mavergreen-cmake }

  retry:
    needs: [ver, publish]
    if: always() && needs.publish.result == 'failure'
    permissions: { contents: read, actions: write }
    uses: Mavergreen/shipyard/.github/workflows/retry-release.yml@v1
    with: { version: "${{ needs.ver.outputs.version }}" }

  required:
    name: required (release)
    if: always()
    needs: [ver, build, vm-test, modern-smoke, scan, publish, retry]
    runs-on: ubuntu-latest
    steps:
      - uses: Mavergreen/shipyard/.github/actions/required-gate@v1
        with:
          needs: ${{ toJSON(needs) }}
